}

.mini span.d{color:var(--ok)} .mini span.u{color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--paper);font-weight:400;width:100%}
textarea{min-height:70px;resize:vertical}
textarea.trmini{min-height:40px;transition:min-height .15s}textarea.trmini:focus,textarea.trmini.filled{min-height:80px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:13px;font-weight:600}
td.c,th.c{text-align:center;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:20}
.modal{background:var(--paper);border-radius:14px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:30;font-size:14px}
.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-size:14px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mk{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
span.mk{cursor:default}
.mk.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.item.lec{align-items:flex-start}
.item.lec.done .what b{text-decoration:none}
.cnt{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.cnt.on{background:var(--ok);border-color:var(--ok);color:#fff}
.duty{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.duty .st{flex:1;min-width:180px}
.duty .st b{display:block;font-size:17px}
.duty .st small{color:var(--muted);font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.links a{border:1px solid var(--brand);color:var(--brand);border-radius:8px;padding:2px 10px;text-decoration:none;font-weight:600}
.links a:hover{background:var(--soft)}
.lec-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.lec-row:first-of-type{border-top:0}
.lec-row .tm{min-width:92px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.lec-row .what{flex:1;min-width:0}
.lec-row .what b{display:block;font-weight:600;line-height:1.5}
.lec-row .what small{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chkl{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:500;padding:6px 0;border-top:1px solid var(--line)}
.chkl input{width:auto}
.login{text-align:center;align-items:center;display:flex;flex-direction:column;gap:12px;padding:28px 18px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kq6{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kq{background:#fff;border-radius:12px;padding:8px 10px;border:1px solid #E3E9F1;border-inline-start:5px solid var(--brand)}.kq b{display:block;font-size:22px;line-height:1.2;color:var(--brand-deep)}.kq small{color:var(--muted);font-size:12px}.kq.ok{border-inline-start-color:var(--ok)}.kq.ok b{color:var(--ok)}.kq.bad{border-inline-start-color:var(--bad)}.kq.bad b{color:var(--bad)}.kq.gold{border-inline-start-color:var(--gold)}.kq.gold b{color:var(--gold-ink)}.kq.gray{border-inline-start-color:#94a3b8}
.arbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 14px;border:1px solid #E3E9F1;flex-wrap:wrap}.arbar .bar{flex:1;min-width:120px;height:10px;background:#EEF2F7;border-radius:99px;overflow:hidden}.arbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#2BB3A3)}.arbar b{font-size:20px;color:var(--ok)}.arbar small{font-size:12.5px}.up{color:var(--ok);font-weight:700}
.arseg{display:flex;gap:6px;flex-wrap:wrap}.arseg button{border:1px solid #DCE5EF;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer}.arseg button.on{background:var(--brand-deep);color:#fff;border-color:transparent}
.arg{font-size:14px;font-weight:700;color:var(--brand-deep);margin:4px 0 -4px}.arg em{font-style:normal;font-weight:500;color:var(--muted);font-size:12.5px}
.ari{background:#fff;border-radius:12px;border:1px solid #E3E9F1;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}.ari .nm{font-weight:700}.ari .nm small{color:var(--muted);font-weight:500;margin-inline-start:6px}
.ari .ev{grid-column:1/2;display:flex;gap:8px;flex-wrap:wrap;font-size:13px}.ari .ev span{background:#F4F7FB;border-radius:8px;padding:2px 8px}.ari .ev .o{background:#FEF2F2;color:#991B1B}.ari .ev .z{background:#ECFDF3;color:#166534}.ari .ev .p{background:var(--gold-soft);color:var(--gold-ink)}.ari .ev .rp{background:#EAF1F8;color:var(--brand-deep)}.ari .ev .tg{background:#E8F4FD;color:#0B4F7C}.ari .ev .nt{background:#F5F3FF;color:#4C1D95}
.arhow{margin:-2px 0 2px;font-size:13px}.arhow summary{cursor:pointer;color:var(--brand);font-weight:700;width:max-content}.arhow p{margin:4px 0;background:#F8FAFC;border-radius:8px;padding:4px 10px}
.ari .acts{grid-row:1/4;grid-column:2;display:flex;gap:6px}.ab{border:1.5px solid #CBD5E1;background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;color:#334155;cursor:pointer}.ab.y{border-color:#4ADE80;background:#ECFDF3;color:#166534}.ab.n{color:#991B1B}.ab.n.on{background:#FEF2F2;border-color:#F87171}
.ari.bad{border-inline-start:4px solid var(--bad)}.ari.warn{border-inline-start:4px solid var(--gold)}.ari.gr{border-inline-start:4px solid #94a3b8}.ari.ex{opacity:.55}
.arsbar{position:sticky;bottom:0;z-index:5;background:#fff;border-top:2px solid var(--gold);border-radius:12px 12px 0 0;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,50,98,.08)}
.arf .item.done b{text-decoration:line-through;opacity:.7}.arf .chk{width:24px;height:24px;border:2px solid #CBD5E1;border-radius:6px;background:#fff;display:inline-grid;place-items:center;flex:none;color:#fff;cursor:pointer;padding:0}.arf .chk.on{background:var(--ok);border-color:var(--ok)}
@media(max-width:640px){.kq6{grid-template-columns:repeat(3,1fr)}.ari{grid-template-columns:1fr}.ari .acts{grid-row:auto;grid-column:1}}
.lth{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.lth h2{margin:0}
.ltk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ltk div{background:#F5F8FC;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}.ltk b{display:block;font-size:20px;color:var(--brand-deep)}.ltk .hi{background:#FFF6DC}.ltk .hi b{color:#8A5A00}
.ltip{background:#FFF8E4;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:13px}
.ltl{columns:2;column-gap:24px;margin:0;padding:0;list-style:none;max-height:50vh;overflow:auto}.ltl li{break-inside:avoid;padding:6px 8px;border-bottom:1px solid #EEF1F5;font-size:14.5px;display:flex;gap:10px}.ltl .rn{font-size:11.5px;color:var(--muted);min-width:26px}
.ltu{border:1px dashed #C9D3DF;border-radius:10px;padding:8px 12px;font-size:13px}
@media(max-width:700px){.ltl{columns:1}.ltk{grid-template-columns:1fr 1fr}}
.seh3{font-size:15.5px;margin:16px 0 8px;color:var(--brand-deep)}.seul{margin:6px 0;padding-inline-start:20px;line-height:1.9}.sem{border:1px solid var(--line,#e3e8ef);border-radius:10px;padding:10px 12px;margin-top:10px}.semh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.semh a{text-decoration:none}.item.sewrap{flex-wrap:wrap}.item.sewrap .what{flex-basis:100%}.card.se .kpis{margin-bottom:8px}
</style>
</head>

// موعد الخطوة بدقائق اليوم (قد يتجاوز 1440 بعد منتصف الليل)
function stepWin(s, st, ds){ if(!s.start || st.length<6) return null;
  if(st[2]==="m"){ const v=ds?marksOf(ds,s.id).startmsg:null; if(typeof v!=="number") return null; const b=cairoMinOf(v,ds); return {from:b+st[3], due:b+st[5]}; } // نسبةً لوقت تعليم «الشيخ انضم»
  const a=toMin(s.start); let e=s.end?toMin(s.end):a+90; if(e<=a) e+=1440;
  const at=(r,o)=>(r==="s"?a:e)+o; return {from:at(st[2],st[3]), due:st[4]?at(st[4],st[5]):Infinity}; }
// وقت الإتمام (بختم الخادم) بدقائق اليوم نسبةً لتاريخ المحاضرة
function cairoMinOf(epoch, ds){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(epoch)).forEach(x=>o[x.type]=x.value);
  const d=o.year+"-"+o.month+"-"+o.day; const days=Math.round((parse(d)-parse(ds))/864e5); return days*1440+(+o.hour)*60+(+o.minute); }
// حالة الخطوة: done / late-done / now / late / soon
function stepState(ds, s, st, v){ const w=stepWin(s,st,ds);
  if(v && fixOf(ds,s.id,st[0])) return "lateDone"; // تصحيح مسئول = تمت متأخرة
  if(v){ if(w && typeof v==="number" && cairoMinOf(v,ds)>w.due+STEP_GRACE) return "lateDone"; return "done"; }
  if(!w) return "soon"; const t=today(); if(ds<t) return "late"; if(ds>t) return "soon";
  const now=toMin(cairoNow().hm); return now>w.due+STEP_GRACE ? "late" : now>=w.from ? "now" : "soon"; }
const adminLec = s => !!(s && isLecture(s) && memberOf(s.owner).role==="committee"); // محاضرة يأخذها مسئول اللجنة: «تمت» بضغطة بلا خطوات ولا دوام

function reqDates(r){ const out=[]; let d=r.date; const end=(r.kind==="leave"||r.kind==="lecture")?(r.dateTo||r.date):r.date; for(let i=0;i<70 && d<=end;i++){ out.push(d); d=addDays(d,1); } return out; }

function dutyPill(mid, d){ if(d>=SLOT_DUTY_SINCE) return dutyPillSlots(mid,d);
  const sh=shiftOf(mid,d), st=shState(sh), off=dayOff(mid,d), late=lateBy(mid,d);
  const lt = late ? `<span class="pill bad">متأخر ${dur(late)}</span>` : "";
  if(st==="none"){ if(off) return `<span class="pill">${esc(REQ[off.kind])}</span>`;
    const f=firstStart(mid,d), due = d<today() || (d===today() && f!=null && toMin(cairoNow().hm) > f-GOAL.before+GOAL.grace);
    return slotsOf(mid,d).length ? `<span class="pill ${due?"bad":""}">لم يبدأ الدوام</span>` : ""; }
  if(st==="on") return `<span class="pill ok">في الدوام منذ ${esc(t12(sh.start))}</span>`+lt;
  if(st==="break") return `<span class="pill gold">في استراحة</span>`+lt;

}
function dutyPillSlots(mid, d){ const ex=dutyExp(mid,d); if(!ex.length){ const off=dayOff(mid,d); return off?`<span class="pill">${esc(REQ[off.kind])}</span>`:""; }

function periodStats(mid, from, to, lecOnly){ // lecOnly: محاضرات العضو بس (عضوات شئون الطلاب عند مسئول التنظيم، 25 نوفمبر)

    if(best && best[1]>=3){ used.add(best[0].id); const sq=v=>String(v||"").replace(/\s+/g,"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)); const diff=IMP_F.filter(([k])=>x[k] && sq(x[k])!==sq(best[0][k])); if(diff.length) ops.push({kind:"chg",row:x,lec:best[0],diff}); else ops.push({kind:"same",row:x,lec:best[0]});
