<style>
/* هوية وحي: أزرق متدرج + ذهبي، صفحة واحدة بسيطة: ما المطلوب اليوم، وهل تم */
:root{

  color-scheme:light;
}
*{box-sizing:border-box}

// ---------- أدوات ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
// التاريخ والوقت بتوقيت القاهرة دائمًا (نفس توقيت الخادم)
// الوقت الحالي مصحَّحًا بساعة الخادم (لو ساعة الجهاز غلط)
const NOW = () => Date.now() + (S.skew||0);
function cairoNow(){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(NOW())).forEach(x=>o[x.type]=x.value); return {date:o.year+"-"+o.month+"-"+o.day, hm:o.hour+":"+o.minute}; }
const today = () => cairoNow().date;
// الثواني بتوقيت القاهرة منذ منتصف الليل (للعدّاد الحي)
function cairoSec(){ const o={}; new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date(NOW())).forEach(x=>o[x.type]=x.value); return (+o.hour)*3600+(+o.minute)*60+(+o.second); }
// التاريخ الهجري (تقويم أم القرى) والميلادي الكامل
function hijri(ds){ try{ const [y,m,d]=ds.split("-").map(Number); return new Intl.DateTimeFormat("ar-EG-u-ca-islamic-umalqura-nu-latn",{timeZone:"UTC",day:"numeric",month:"long",year:"numeric"}).format(new Date(Date.UTC(y,m-1,d,12))); }catch(e){ return ""; } }
const gregFull = ds => { const d=parse(ds); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" م"; };
const datesHtml = ds => `<div class="dates"><span><b>${esc(gregFull(ds))}</b></span><span>${esc(hijri(ds))}</span></div>`;
const hms = sec => { sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), x=sec%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); };
const hmLong = sec => { sec=Math.max(0,Math.round(sec/60)); const h=Math.floor(sec/60), m=sec%60; return h ? h+" س"+(m?" و"+m+" د":"") : m+" د"; };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const toMin = t => { const [h,m]=String(t||"").split(":").map(Number); return isNaN(h)?null:h*60+(m||0); };
const fromMin = n => { n=((n%1440)+1440)%1440; return pad(Math.floor(n/60))+":"+pad(n%60); };
const dur = m => { m=Math.max(0,Math.round(m||0)); const h=Math.floor(m/60), r=m%60; return h ? h+" س"+(r?" "+r+" د":"") : r+" د"; };
const dayIdx = d => (d.getDay()+1)%7; // 0 = السبت
const fmtDay = s => { const d = parse(s); return DAYS[dayIdx(d)]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; };
const t12 = t => { const [h,m] = String(t||"").split(":").map(Number); if(isNaN(h)) return ""; const p = h<12?"ص":"م"; const hh = h%12||12; return hh+(m?":"+pad(m):"")+" "+p; };
const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function toast(m){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
const nameOf = id => (S.members.find(m=>m.id===id)||{}).name || "—";
const isMgr = () => S.me && (S.me.role==="committee" || S.me.role==="head");
const isAdmin = () => S.me && S.me.role==="committee";
// «👁 شاشته» (قرار المستخدم 9 نوفمبر): مسئول اللجنة يرى شاشة أي عضو، ومسئول القسم أعضاء قسمه فقط — للعرض فقط
const canView = id => !!(isMgr() && id && id!==S.me.id && (isAdmin() ? S.members.some(m=>m.id===id && m.role!=="committee") : team().some(m=>m.id===id)));

const asBtn = id => canView(id) ? `<button class="btn sm ghost" data-a="asView" data-id="${esc(id)}" title="عرض شاشته كما تظهر له">👁 شاشته</button>` : "";
function team(){ // من أتابعهم
  const act = S.members.filter(m => m.active!==false && m.role!=="committee");
  if(isAdmin()) return act;
  if(S.me.role==="head") return act.filter(m => m.dept===S.me.dept && m.id!==S.me.id);

// ---------- بيانات اليوم ----------
// إيقاف مؤقت لمحاضرة (قرار المستخدم 8 نوفمبر): من تاريخ إلى تاريخ، لا تظهر ولا تُحسب ثم تعود وحدها
const lecPaused = (l, date) => !!(l && (l.hold===true || (l.pauseFrom && l.pauseTo && l.pauseFrom<=date && date<=l.pauseTo) || (l.startFrom && date<l.startFrom))); // موقوفة مؤقتًا أو لم تبدأ بعد
// الاستراحة (قرار المستخدم 9 نوفمبر): أي خانة غير محاضرة في اسمها «استراحة» أو «بريك» — بلا أزرار ولا تُحسب
const isBreak = s => !!s && s.lecture!==true && /استراحة|بريك/.test(s.label||"");
// المحاضرة المشتركة (قرار المستخدم 9 نوفمبر): خانتان لنفس المنظّم في نفس اليوم والوقت وبنفس رابط الزووم = محاضرة واحدة،
// تُعرض مرة وتُعلَّم مرة وتُحسب مرة؛ الأصل صاحب أصغر معرّف (والخادم يطبّق نفس القاعدة)
const lecZoom = s => { const l=s && s.lec && S.lectures.find(x=>x.id===s.lec); return l && l.zoom ? String(l.zoom).trim() : ""; };
const sameRun = (a,b) => a.owner===b.owner && !!a.lec && !!b.lec && a.lec!==b.lec && (a.date||"")===(b.date||"") && Number(a.day)===Number(b.day) && !!a.start && a.start===b.start && (a.end||"")===(b.end||"") && !!lecZoom(a) && lecZoom(a)===lecZoom(b);
function twinLabel(ss){ const w=ss.map(s=>String(s.label||"").split(" ")); let k=0; while(w.every(x=>k<x.length-1 && x[k]===w[0][k])) k++; if(k>1) k--; return ss.map((s,i)=>i?w[i].slice(k).join(" "):s.label).join(" + "); }
function mergeTwins(list){ return list.filter(s=>!list.some(o=>o.id<s.id && sameRun(o,s))).map(s=>{ const tw=list.filter(o=>o.id>s.id && sameRun(s,o)); return tw.length ? {...s, label:twinLabel([s,...tw]), twinLecs:tw.map(o=>o.lec)} : s; }); }
const allSlotsOf = (mid, date) => mergeTwins(S.slots.filter(s => s.owner===mid && s.kind!=="flex" && (s.date ? s.date===date : Number(s.day)===dayIdx(parse(date))) && !(s.lec && lecPaused(S.lectures.find(l=>l.id===s.lec), date)))).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99")||(a.label||"").localeCompare(b.label||""));
const slotsOf = (mid, date) => allSlotsOf(mid,date).filter(s=>!isBreak(s));
const breakRow = s => `<div class="item brk"><span class="chk" aria-hidden="true">☕</span><div class="what"><b>${esc(s.label)}</b><small>${s.start?esc(t12(s.start))+(s.end?" – "+esc(t12(s.end)):""):""}</small></div></div>`;
const slotDoneId = (date, sid) => "sch_"+date+"_"+sid;
const slotTask = (date, sid) => S.tasks.find(t => t.id===slotDoneId(date,sid));
const memberOf = id => S.members.find(m=>m.id===id) || {};
// المحاضرة التي تحتاج تنظيمًا لها 4 علامات؛ افتراضيًا كل شغل المنظمين، ويمكن تفعيلها لشغل أي مشرف من صفحة الجدول
const isLecture = s => !!s && (!!s.lec || (s.lecture===true && !!s.date)); // المحاضرة = مربوطة بجدول الأكاديمية (شيت اللينكات) فقط؛ والبديل ليوم محدد
const marksOf = (date, sid) => (slotTask(date,sid)||{}).marks || {};
const markCount = (date, sid) => { const m=marksOf(date,sid); return stepsFor(date).filter(([k])=>m[k]).length; };
// موعد الخطوة بدقائق اليوم (قد يتجاوز 1440 بعد منتصف الليل)
function stepWin(s, st){ if(!s.start || st.length<6) return null; const a=toMin(s.start); let e=s.end?toMin(s.end):a+90; if(e<=a) e+=1440;
  const at=(r,o)=>(r==="s"?a:e)+o; return {from:at(st[2],st[3]), due:st[4]?at(st[4],st[5]):Infinity}; }
// وقت الإتمام (بختم الخادم) بدقائق اليوم نسبةً لتاريخ المحاضرة
function cairoMinOf(epoch, ds){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(epoch)).forEach(x=>o[x.type]=x.value);
  const d=o.year+"-"+o.month+"-"+o.day; const days=Math.round((parse(d)-parse(ds))/864e5); return days*1440+(+o.hour)*60+(+o.minute); }
// حالة الخطوة: done / late-done / now / late / soon
function stepState(ds, s, st, v){ const w=stepWin(s,st);
  if(v){ if(w && typeof v==="number" && cairoMinOf(v,ds)>w.due+STEP_GRACE) return "lateDone"; return "done"; }
  if(!w) return "soon"; const t=today(); if(ds<t) return "late"; if(ds>t) return "soon";
  const now=toMin(cairoNow().hm); return now>w.due+STEP_GRACE ? "late" : now>=w.from ? "now" : "soon"; }
const adminLec = s => !!(s && isLecture(s) && memberOf(s.owner).role==="committee"); // محاضرة يأخذها مسئول اللجنة: «تمت» بضغطة بلا خطوات ولا دوام
const isSlotDone = (date, sid) => { const t=slotTask(date,sid); if(!t) return false; const s=S.slots.find(x=>x.id===sid);
  if(adminLec(s)) return t.status==="done";
  return isLecture(s) && t.marks ? stepsFor(date).every(([k])=>t.marks[k]) : t.status==="done"; };
// البديل: محاضرات الطلب التي ستحتاج من يغطيها
function reqDates(r){ const out=[]; let d=r.date; const end=(r.kind==="leave"||r.kind==="lecture")?(r.dateTo||r.date):r.date; for(let i=0;i<70 && d<=end;i++){ out.push(d); d=addDays(d,1); } return out; }
function reqLectures(r){ if(r.kind==="fix" || r.kind==="offer") return [];
  return reqDates(r).flatMap(d=>slotsOf(r.member,d).filter(s=>isLecture(s) && (r.kind!=="lecture" || s.id===r.slot)).map(s=>({d,s}))); }
function coverSelect(r){ const ls=reqLectures(r); if(!ls.length) return "";
  const ppl=S.members.filter(m=>m.active!==false && m.role!=="committee" && m.id!==r.member && (isAdmin() || m.dept===S.me.dept));
  return `<select id="cv_${esc(r.id)}" style="width:auto" title="من يغطي ${ls.length} محاضرة"><option value="">بلا بديل (${ls.length} ${ls.length>2&&ls.length<11?"محاضرات":"محاضرة"})</option>${ppl.map(m=>`<option value="${esc(m.id)}">البديل: ${esc(m.name)}</option>`).join("")}</select>`; }
async function makeCovers(r, sub){ let n=0;
  for(const {d,s} of reqLectures(r)){ const doc={owner:sub, date:d, day:dayIdx(parse(d)), start:s.start||"", end:s.end||"", kind:"fixed", label:s.label, lecture:true, cover:r.member}; if(s.lec) doc.lec=s.lec;
    if(await save("slots", "cov_"+d+"_"+s.id, doc, false)) n++; }
  return n; }

// جدول الأكاديمية
const lecOf = s => s && s.lec ? S.lectures.find(l=>l.id===s.lec) : null;
const safeUrl = u => /^https:\/\/[^\s"'<>]+$/.test(String(u||"")) ? u : "";

const unassigned = () => S.lectures.filter(l=>l.active!==false && !l.noOrg && !lecPaused(l,today()) && !lecSlots(l.id).length); // «لا يحتاج منظّم» والموقوفة ليست «بلا منظّم»
const lecWhen = l => (DAYS[Number(l.day)]||"")+(l.start?" "+t12(l.start)+(l.end?" – "+t12(l.end):""):"");

const showDaysOf = l => (l && l.showDays!=null && l.showDays!=="" && !isNaN(Number(l.showDays))) ? Number(l.showDays) : 3;
const revealOf = l => l && l.startFrom ? addDays(l.startFrom, -showDaysOf(l)) : null;
const isReserved = l => !!(l && (l.hold===true || (l.startFrom && l.startFrom>today())));
const heldSlotsOf = (mid, ds) => S.slots.filter(s=>s.owner===mid && s.lec && !s.date && Number(s.day)===dayIdx(parse(ds)) && isReserved(lecOf(s)) && lecPaused(lecOf(s),ds));
function reservedCard(mid){ const ls=S.slots.filter(s=>s.owner===mid && s.lec && !s.date).map(s=>[s,lecOf(s)]).filter(([s,l])=>isReserved(l));
  if(!ls.length) return "";
  return `<div class="card resv"><h2>📌 مجالس محجوزة لك</h2><p class="sub" style="font-size:13.5px">لا تُحسب ولا يصلك عنها تذكير حتى تبدأ. تظهر روابطها قبل البداية بأيام.</p>${ls.map(([s,l])=>{ const soon=l.startFrom && today()>=revealOf(l);
    return `<div class="item"><span class="chk" aria-hidden="true" style="border:0">${soon?"🆕":"📌"}</span><div class="what"><b>${esc(l.name)}${l.sheikh?` <span class="shk">${esc(l.sheikh)}</span>`:""}</b><small>${esc(lecWhen(l))} · ${l.startFrom?(soon?`<b style="color:var(--gold-ink)">يبدأ ${esc(fmtDay(l.startFrom))}</b>`:"يبدأ "+esc(fmtDay(l.startFrom))):"موعد البداية يُحدَّد لاحقًا"}</small>${soon?linksHtml(l):""}</div></div>`; }).join("")}</div>`; }
function heldAdminCard(){ if(!isAdmin()) return ""; const ls=S.lectures.filter(l=>l.active!==false && l.hold===true);
  if(!ls.length) return "";
  return `<div class="card resv"><h2>📌 مجالس محجوزة بلا موعد بداية (${ls.length})</h2>${ls.map(l=>{ const org=lecSlots(l.id);

function linksHtml(l, s){ if(!l) return ""; const z=safeUrl(l.zoom), sh=safeUrl(l.sheet), tw=((s&&s.twinLecs)||[]).map(id=>S.lectures.find(x=>x.id===id)).filter(Boolean);
  return `<div class="links">${z?`<a href="${esc(z)}" target="_blank" rel="noopener noreferrer">🎥 فتح زووم</a><button class="lk" data-a="copyZoom" data-u="${esc(z)}">📋 نسخ رابط زووم</button>`:`<span class="pill gray">رابط زووم غير مضاف</span>`}${sh?`<a href="${esc(sh)}" target="_blank" rel="noopener noreferrer">📊 شيت الحضور والغياب${tw.length?" (1)":""}</a>`:`<span class="pill gray">شيت الحضور غير مضاف</span>`}${tw.map((x,i)=>safeUrl(x.sheet)&&safeUrl(x.sheet)!==sh?`<a href="${esc(safeUrl(x.sheet))}" target="_blank" rel="noopener noreferrer">📊 شيت الحضور والغياب (${i+2})</a>`:"").join("")}${l.account?`<span class="pill acct">🔑 حساب زووم: ${esc(l.account)}</span>`:`<span class="pill gray">حساب زووم غير محدد</span>`}</div>`; }
// الطلبات المقبولة تُسقط اليوم أو المحاضرة من الحساب
const okReqs = mid => S.requests.filter(r => r.member===mid && r.status==="accepted");
const dayOff = (mid, date) => okReqs(mid).find(r => (r.kind==="day" && r.date===date) || (r.kind==="leave" && r.date<=date && date<=(r.dateTo||r.date)));

function tsConflicts(mid, ds){ const tm=allSlotsOf(mid,ds).concat(heldSlotsOf(mid,ds)).filter(x=>!isBreak(x) && x.start && x.end && !slotOff(mid,ds,x.id)), bad=new Set();
  tm.forEach((a,i)=>tm.slice(i+1).forEach(b=>{ const a1=toMin(a.start), a2=toMin(a.end), b1=toMin(b.start), b2=toMin(b.end); if(a2>a1 && b2>b1 && a1<b2 && b1<a2){ bad.add(a.id); bad.add(b.id); } })); return bad; }
const tsKind = x => isReserved(lecOf(x)) && lecPaused(lecOf(x),S.sday||today()) ? "hold" : isBreak(x)?"brk":isLecture(x)?"lec":"task";
const tsAll = (mid, ds) => allSlotsOf(mid,ds).concat(heldSlotsOf(mid,ds)).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
const AV=["#0F588C","#00A598","#C4820E","#2D637F","#ED4E33","#6C3302","#9DAD33","#46535E"];
const avatar = (m,i) => `<span class="av" style="background:${AV[i%AV.length]}">${esc((m.name||"؟").replace(/^أ\.\s*/,"").trim().charAt(0))}</span>`;
function viewTeamSched(){
  const depts=isAdmin()?["org","sa"]:[S.me.dept]; if(!depts.includes(S.sdept)) S.sdept=depts[0];
  const dp=S.sdept, DN={org:"المنظّمون",sa:"المشرفون"}, mode=S.smode||"day";
  const t=today(), start=addDays(addDays(t,-dayIdx(parse(t))), 7*(S.swk||0)), days=[...Array(7)].map((_,i)=>addDays(start,i));
  if(!S.sday || !days.includes(S.sday)) S.sday = days.includes(t)?t:days[0];
  const all=tsPeople(dp), one=all.find(m=>m.id===S.sper), ppl=one?[one]:all, cf=days.map(ds=>ppl.some(m=>tsConflicts(m.id,ds).size)), nconf=cf.filter(Boolean).length;
  const free=ds=> isAdmin() && dp==="org" && !one ? S.lectures.filter(l=>l.active!==false && !l.noOrg && !lecPaused(l,ds) && Number(l.day)===dayIdx(parse(ds)) && !lecSlots(l.id).length) : [];
  const chips=days.map((ds,i)=>{ const d=parse(ds), n=ppl.reduce((k,m)=>k+tsAll(m.id,ds).filter(x=>!isBreak(x)).length,0), fr=free(ds).length;
    return `<button class="dchip ${ds===S.sday&&mode==="day"?"on":""} ${ds===t?"tdy":""}" data-a="sday" data-v="${ds}"><b>${DAYS[i]}</b><small>${d.getDate()} ${MONTHS[d.getMonth()]}</small><span class="dn">${n} ${n===1?"بند":"بنود"}</span>${cf[i]?`<i class="dot bad" title="تعارض"></i>`:fr?`<i class="dot gold" title="بلا منظّم"></i>`:""}</button>`; }).join("");
  const top = ptitle((one?"جدول "+one.name:"جدول "+DN[dp])+" — "+(mode==="day"?fmtDay(S.sday):"أسبوع "+fmtDay(start)))+`
  <div class="tshead noprint"><div><h1>${one?"جدول "+esc(one.name):"جداول الفريق"}</h1><p class="sub">${one?(dp==="org"?"منظّم":"مشرف"):ppl.length+" "+(dp==="org"?"منظّم":"مشرف")} · أسبوع ${esc(fmtDay(start))}${nconf?` · <span class="late">تعارض في ${nconf} ${nconf===1?"يوم":"أيام"}</span>`:""}</p></div>
    <div class="tsctl">${depts.length>1?`<div class="seg sm">${depts.map(k=>`<button class="${k===dp?"on":""}" data-a="sdept" data-v="${k}">${DN[k]}</button>`).join("")}</div>`:""}
    <label class="pick" title="اختر شخصًا لعرض جدوله فقط">👤<select data-a="sper"><option value="">كل ${dp==="org"?"المنظّمين":"المشرفين"}</option>${all.map(m=>`<option value="${esc(m.id)}" ${one&&one.id===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select></label>${one?`<button class="btn sm ghost" data-a="sper0">✕ الكل</button>${asBtn(one.id)}`:""}

  if(!ppl.length) return top+`<div class="card"><div class="empty">لا يوجد أعضاء نشطون في هذا القسم.</div></div>`;
  return top + (mode==="day" ? tsDay(ppl, S.sday, free(S.sday)) : tsWeek(ppl, days, free)) + legend;
}
// عرض اليوم: خط زمني، عمود لكل شخص، والبنود بطول مدتها
function tsDay(ppl, ds, fr){
  const PX=1.1, all=ppl.flatMap(m=>tsAll(m.id,ds)).concat(fr.map(l=>({start:l.start,end:l.end})));
  const ts=all.filter(x=>x.start).map(x=>toMin(x.start)), te=all.filter(x=>x.end||x.start).map(x=>{ const a=toMin(x.start||x.end), e=x.end?toMin(x.end):a+60; return e>a?e:a+60; });
  const h0=Math.max(0,Math.floor((ts.length?Math.min(...ts):480)/60)), h1=Math.min(24,Math.ceil((te.length?Math.max(...te):1320)/60)), H=Math.max(h1-h0,4), top0=h0*60;
  const hrs=[...Array(H+1)].map((_,i)=>h0+i);
  const grid=`<div class="tl-hours">${hrs.map(h=>`<span style="top:${(h*60-top0)*PX}px">${t12(pad(h%24)+":00")}</span>`).join("")}</div>`;
  const lines=hrs.map(h=>`<i class="hl" style="top:${(h*60-top0)*PX}px"></i>`).join("");
  const nowM = ds===today() ? toMin(cairoNow().hm) : -1, showNow = nowM>=top0 && nowM<=h1*60;
  const now = showNow ? `<i class="nowl" style="top:${(nowM-top0)*PX}px"></i>` : "", nowAx = showNow ? `<i class="nowl ax" style="top:${(nowM-top0)*PX}px"><b>الآن</b></i>` : "";
  const block=(x,cls,mid,lane,lanes,bad)=>{ if(!x.start) return ""; const a=toMin(x.start), e=x.end&&toMin(x.end)>a?toMin(x.end):a+45, off=mid&&x.id?slotOff(mid,ds,x.id):null;
    const w=100/lanes, sk=(lecOf(x)||{}).sheikh, h=(e-a)*PX;
    return `<div class="blk ${cls} ${bad?"conf":""} ${off?"off":""} ${h<40?"tiny":""}" style="top:${(a-top0)*PX}px;height:${h-2}px;inset-inline-start:calc(${lane*w}% + 3px);width:calc(${w}% - 6px)" title="${esc((x.label||x.name)+" · "+t12(x.start)+(x.end?" – "+t12(x.end):""))}">
      <small>${esc(t12(x.start))}${x.end?" – "+esc(t12(x.end)):""}</small><b>${cls==="brk"?"☕ ":cls==="hold"?"📌 ":bad?"⚠️ ":""}${esc(x.label||x.name)}</b>${cls==="hold"?`<em>محجوز${(lecOf(x)||{}).startFrom?" · يبدأ "+esc(fmtDay(lecOf(x).startFrom)):""}</em>`:""}${sk&&h>=70?`<em>${esc(sk)}</em>`:""}${x.cover?`<em>بديل عن ${esc(nameOf(x.cover))}</em>`:""}${off?`<em>${esc(okLabel(off))}</em>`:""}</div>`; };
  const lanesOf=items=>{ const L=[]; items.sort((p,q)=>toMin(p.start)-toMin(q.start)).forEach(x=>{ const a=toMin(x.start); let k=L.findIndex(end=>end<=a); const e=x.end&&toMin(x.end)>a?toMin(x.end):a+45; if(k<0){ k=L.length; L.push(e); } else L[k]=e; x._lane=k; }); return Math.max(1,L.length); };
  const busy=ppl.map((m,i)=>[m,i]).filter(([m])=>tsAll(m.id,ds).length), idle=ppl.map((m,i)=>[m,i]).filter(([m])=>!tsAll(m.id,ds).length);
  const cols=busy.map(([m,i])=>{ const sl=tsAll(m.id,ds).filter(x=>x.start), bad=tsConflicts(m.id,ds), n=lanesOf(sl), noT=allSlotsOf(m.id,ds).filter(x=>!x.start);
      const lec=sl.filter(x=>isLecture(x)&&!isReserved(lecOf(x))).length, mins=sl.filter(x=>!isBreak(x)&&!isReserved(lecOf(x))&&x.end).reduce((k,x)=>k+Math.max(0,toMin(x.end)-toMin(x.start)),0);
      return `<div class="tl-col"><div class="tl-h">${avatar(m,i)}<div class="tl-nm"><b title="${esc(m.name)}">${esc(m.name)}</b><small>${[lec?lec+" محاضرة":"", mins?dur(mins):""].filter(Boolean).join(" · ")}</small></div></div>
      <div class="tl-body" style="height:${H*60*PX}px">${lines}${now}${sl.map(x=>block(x,tsKind(x),m.id,x._lane,n,bad.has(x.id))).join("")}</div>
      ${noT.length?`<div class="tl-not">${noT.map(x=>`<span>${esc(x.label)}</span>`).join("")}</div>`:""}</div>`; }).join("");
  const frc = fr.length ? (()=>{ const it=fr.map(l=>({...l, label:l.name})), n=lanesOf(it); return `<div class="tl-col free"><div class="tl-h"><span class="av" style="background:var(--bad)">!</span><div class="tl-nm"><b>بلا منظّم</b><small>${fr.length} محاضرة</small></div></div><div class="tl-body" style="height:${H*60*PX}px">${lines}${it.map(x=>block(x,"freeb",null,x._lane,n,false)).join("")}</div></div>`; })() : "";
  const idl = idle.length ? `<div class="tl-idle"><span class="sub">لا شيء في جدولهم هذا اليوم:</span>${idle.map(([m,i])=>`<span class="ip">${avatar(m,i)}${esc(m.name)}</span>`).join("")}</div>` : "";
  if(!busy.length && !fr.length) return `<div class="card"><div class="empty">لا يوجد شغل مجدول لهم في هذا اليوم.</div></div>`+idl;
  return `<div class="card tl"><div class="tl-scroll"><div class="tl-axis"><div class="tl-h"></div><div class="tl-body" style="height:${H*60*PX}px">${grid}${nowAx}</div></div>${frc}${cols}</div></div>${idl}`;
}
// عرض الأسبوع: صف لكل شخص، وفي كل يوم بطاقات صغيرة
function tsWeek(ppl, days, free){ const t=today();
  const head=`<tr><th class="nm"></th>${days.map((ds,i)=>{ const d=parse(ds); return `<th class="${ds===t?"tdy":""}"><b>${DAYS[i]}</b><small>${d.getDate()} ${MONTHS[d.getMonth()]}</small></th>`; }).join("")}</tr>`;
  const card=(x,mid,ds,bad)=>{ const off=slotOff(mid,ds,x.id), k=isReserved(lecOf(x))&&lecPaused(lecOf(x),ds)?"hold":tsKind(x); return `<div class="wc ${k} ${bad?"conf":""} ${off?"off":""}" title="${esc(x.label)}"><small>${x.start?esc(t12(x.start))+(x.end?" – "+esc(t12(x.end)):""):"بلا موعد"}</small><b>${k==="brk"?"☕ ":k==="hold"?"📌 ":bad?"⚠️ ":""}${esc(x.label.length>(x.twinLecs?90:42)?x.label.slice(0,42)+"…":x.label)}</b>${x.cover?`<em>بديل</em>`:""}${off?`<em>${esc(okLabel(off))}</em>`:""}</div>`; };
  const rows=ppl.map((m,i)=>`<tr><th class="nm">${avatar(m,i)}<span>${esc(m.name)}</span></th>${days.map(ds=>{ const sl=tsAll(m.id,ds), bad=tsConflicts(m.id,ds); return `<td class="${ds===t?"tdy":""}">${sl.map(x=>card(x,m.id,ds,bad.has(x.id))).join("")||`<span class="none">—</span>`}</td>`; }).join("")}</tr>`).join("");
  const fr=days.map(ds=>free(ds)); const frRow = fr.some(x=>x.length) ? `<tr class="free"><th class="nm"><span class="av" style="background:var(--bad)">!</span><span>بلا منظّم</span></th>${fr.map((ls,i)=>`<td class="${days[i]===t?"tdy":""}">${ls.map(l=>`<div class="wc freeb"><small>${esc(t12(l.start||""))}</small><b>${esc(l.name)}</b></div>`).join("")||`<span class="none">—</span>`}</td>`).join("")}</tr>` : "";
  return `<div class="card tsw"><div class="tsw-scroll"><table><thead>${head}</thead><tbody>${rows}${frRow}</tbody></table></div></div>`; }
// مجالس معروضة على المنظّمين (قرار 8 نوفمبر): المنظّم يرغب، ومسئول اللجنة يعتمد
function offersCard(me){ if(memberOf(me).dept!=="org") return "";
  const ls=S.lectures.filter(l=>l.offer && l.active!==false && !S.slots.some(s=>s.lec===l.id && s.owner===me));
  if(!ls.length) return "";
  return `<div class="card"><h2>مجالس معروضة عليك</h2><p class="sub" style="font-size:14px">إن أردت تنظيم أحدها اضغط «أرغب في تنظيمه»، ويعتمد مسئول اللجنة فيُضاف لجدولك.</p>${ls.map(l=>{ const mine=S.requests.find(r=>r.kind==="offer" && r.slot===l.id && r.member===me && r.status==="pending");
    return `<div class="item"><div class="what"><b>${esc(l.name)}${l.sheikh?` <span class="shk">${esc(l.sheikh)}</span>`:""}</b><small>${esc(lecWhen(l))}${l.startFrom?" · يبدأ "+esc(fmtDay(l.startFrom)):""}</small></div>${mine?`<span class="pill ok">أرسلت رغبتك</span><button class="btn sm ghost" data-a="cancelReq" data-id="${esc(mine.id)}">إلغاء</button>`:`<button class="btn sm" data-a="wantLec" data-id="${esc(l.id)}">أرغب في تنظيمه</button>`}</div>`; }).join("")}</div>`; }

// متابعات المسئول في «يومي»: التقارير المرسلة (أسبوعي/شهري) والتقييم الشهري
function followCards(me){
  const mine=S.evals.filter(e=>e.member===me && !/^ar_/.test(e.id||"")), pend=mine.filter(e=>!e.ack).sort((a,b)=>(b.month||"").localeCompare(a.month||""));

    return `<div class="card follow"><h2>${title}</h2>${metricsHtml(x)}
    ${!isRep?`<div class="row" style="margin-top:8px">${e.quality?`<span class="pill">جودة العمل: ${esc(SCORE[e.quality])}</span>`:""}${e.coop?`<span class="pill">التعاون والالتزام: ${esc(SCORE[e.coop])}</span>`:""}${MET[e.goalMet]?`<span class="pill ${MET[e.goalMet][1]}">هدف الشهر الماضي: ${MET[e.goalMet][0]}</span>`:""}</div>`:""}
    ${e.headNote?`<p style="margin:8px 0 0"><b>ملاحظة المسئول:</b> ${esc(e.headNote)}</p>`:""}${!isRep&&e.goal&&e.goal.text?`<p style="margin:6px 0 0"><b>هدفك للشهر القادم:</b> ${esc(e.goal.text)}</p>`:""}
    <label style="margin-top:8px">تعليقك (اختياري)<input id="ack_${esc(e.id)}"></label><div class="row" style="margin-top:6px"><button class="btn" data-a="ackEval" data-id="${esc(e.id)}">اطّلعت</button></div></div>`; }).join("");
  const goal=mine.filter(e=>/^ev_/.test(e.id)).sort((a,b)=>(b.month||"").localeCompare(a.month||""))[0];
  if(!pend.length && goal && goal.goal && goal.goal.text) h+=`<div class="banner">🎯 <b>هدفك هذا الشهر:</b> ${esc(goal.goal.text)}</div>`;
  return arFollow(me)+h; }

// جدولي الأسبوعي: جدول الشخص نفسه فقط (لا يُعرض جدول غيره)

      return `<div class="wev ${lec?"":"task"} ${s.cover?"cover":""} ${off?"off":""}"><small>${s.start?esc(t12(s.start))+(s.end?" – "+esc(t12(s.end)):""):"بلا موعد"}</small>${done?` <span class="ok">✓</span>`:""}<b>${esc(s.label)}</b>${s.cover?`<small>بديل عن ${esc(nameOf(s.cover))}</small>`:""}${off?`<small>${esc(okLabel(off))}</small>`:""}</div>`; }).join("");
    const hv=heldSlotsOf(mid,ds).map(s=>{ const l=lecOf(s); return `<div class="wev hold"><small>${esc(t12(s.start||""))}${s.end?" – "+esc(t12(s.end)):""}</small><b>📌 ${esc(s.label)}</b><small>محجوز لك · ${l.startFrom?"يبدأ "+esc(fmtDay(l.startFrom)):"يُحدَّد موعد البداية لاحقًا"}</small></div>`; }).join("");
    const d=parse(ds);
    return `<div class="wday ${ds===t?"today":""} ${sl.length||hv?"":"empty"}"><h3>${DAYS[i]} <small>${d.getDate()} ${MONTHS[d.getMonth()]}</small>${ds===t?`<span class="pill gold">اليوم</span>`:""}</h3>${evs+hv||`<small class="sub">لا شيء</small>`}</div>`; }).join("");

    if(k==="cd"){ const left=Number(e.dataset.t)-now; if(left>0){ e.classList.remove("late"); e.textContent="متبقي على بدء دوامك: "+(left>3600?hmLong(left):hms(left)); } else { e.classList.add("late"); e.textContent="تأخرت عن موعد الدوام "+hmLong(-left); } }

    if(k==="br"){ e.textContent=hms((NOW()-Number(e.dataset.a))/1000); }

      <td class="lk">${z?`<a href="${esc(z)}" target="_blank" rel="noopener noreferrer" title="فتح زووم">🎥</a>`:""}${sh?`<a href="${esc(sh)}" target="_blank" rel="noopener noreferrer" title="شيت الحضور">📊</a>`:""}${asBtn(m.id).replace("👁 شاشته","👁")}</td></tr>`; }).join("");
  const seg = isAdmin() ? `<div class="seg sm" style="width:auto">${[["all","الكل"],["lec","المحاضرات"],["sa","شئون الطلاب"]].map(([k,l])=>`<button class="${k===f?"on":""}" data-a="dtf" data-v="${k}">${l}</button>`).join("")}</div>` : "";

// ملخص اليوم للمسئول: محاضرات اليوم، تمت، متأخرة الآن، اعتذار الشيخ

    if(isSlotDone(d,s.id)){ dn++; return; } if(adminLec(s)) return; const mk=marksOf(d,s.id); if(stepsFor(d).some(st=>stepState(d,s,st,mk[st[0]])==="late")) late++; }));

function monthStats(mid, month){ const [y,mo]=month.split("-").map(Number); return periodStats(mid, month+"-01", month+"-"+pad(new Date(y,mo,0).getDate())); }
// إحصاءات أي فترة (يوم/أسبوع/شهر)
function periodStats(mid, from, to){
  const t0=today();
  let exp=0, dn=0, work=0, present=0, lates=0, noEnd=0, mins=0, lec=0, lecDone=0, days=0, stepAll=0, stepOn=0, stepLate=0, repNeed=0, repCnt=0, repZoom=0, exc=0, tech=0;
  for(let ds=from; ds<=to; ds=addDays(ds,1)){ if(ds>t0) break; days++;
    const sh=shiftOf(mid,ds), perSlot=ds>=SLOT_DUTY_SINCE; if(!perSlot){ mins+=shMin(sh); if(shState(sh)==="open") noEnd++; }
    slotsOf(mid,ds).forEach(s=>{ const o=slotOff(mid,ds,s.id); if(o && o.kind==="sheikh") exc++; });
    const es=slotsOf(mid,ds).filter(s=>!slotOff(mid,ds,s.id));
    if(ds>=STEPS_SINCE) es.filter(isLecture).forEach(s=>{ if(ds===t0 && !isSlotDone(ds,s.id)) return; repNeed++; const rp=(slotTask(ds,s.id)||{}).report; if(rp){ repCnt++; repZoom+=Number(rp.zoomN)||0; if(repTech(rp)) tech++; } });
    if(perSlot){ const nowM=toMin(cairoNow().hm); dutyExp(mid,ds).forEach(s=>{ const x=slotShift(mid,ds,s.id); if(ds===t0 && !x && nowM<=dutyFrom(s)+GOAL.grace) return;
        work++; if(x){ present++; mins+=shMin(x); if(slotLate(mid,ds,s)) lates++; if(shState(x)==="open") noEnd++; } }); }
    else if(es.length && ds>=GOAL.since && !(ds===t0 && !sh)){ work++; if(sh){ present++; if(lateBy(mid,ds)) lates++; } }
    es.forEach(s=>{ exp++; const ok=isSlotDone(ds,s.id); if(ok) dn++; if(isLecture(s)){ lec++; if(ok) lecDone++;
      if(ds>=STEPS_SINCE && ds<t0 && s.start){ const mk=marksOf(ds,s.id); STEPS.forEach(st=>{ stepAll++; const v=mk[st[0]]; if(v && stepState(ds,s,st,v)==="done") stepOn++; else if(v) stepLate++; }); } } }); }
  const tk=S.tasks.filter(t=>t.type!=="scheduled" && t.assignee===mid && t.due>=from && t.due<=to && t.due<=t0);
  const onTime=tk.filter(t=>t.status==="done" && (t.doneAt||"")<=t.due).length;
  const pr=S.checkins.filter(c=>c.member===mid && c.mark==="warn" && c.date>=from && c.date<=to).length;
  const weekly = lec ? Math.round(lecDone*10/Math.max(1,days/7))/10 : null;
  return {exp,dn,tk:tk.length,onTime,pr,work,present,lates,noEnd,mins,lec,lecDone,weekly,stepAll,stepOn,stepLate,repNeed,repCnt,repAvg:repCnt?Math.round(repZoom/repCnt):null,exc,tech};
}

function seenCell(m){
  if(!m.lastSeen) return `<span class="pill bad">لم يدخل بعد</span>`;
  const t=new Date(Number(m.lastSeen)), dk=new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo"}).format(t);
  const hm=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",hour:"2-digit",minute:"2-digit",hour12:false}).format(t);
  const y=new Date(parse(today()).getTime()-864e5), yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  const day=dk===today()?"اليوم":dk===yk?"أمس":fmtDay(dk), via=m.loginVia==="code"?" · كود":m.loginVia==="google"?" · Google":"";
  const old=(NOW()-Number(m.lastSeen))>3*864e5;
  return `<span class="${old?"late":""}" style="font-size:13px;white-space:nowrap">${esc(day)} ${esc(t12(hm))}${via}</span>`; }

  if(a==="saveCoverLec"){ const l=S.lectures.find(x=>x.id===id), who=v("cl_who"), d=today(); el.disabled=true;
    if(await save("slots", "cov_"+d+"_"+l.id, {...lecSlotData(l,who), date:d}, false)){ close(); toast("كُلِّف "+nameOf(who)+" بها اليوم."); } else el.disabled=false; return; }
  if(a==="evalM") return open(evalForm(id, S.month||today().slice(0,7)));

    const met=document.getElementById("ev_met"); if(met) data.goalMet=met.value;
    if(!data.quality||!data.coop) return toast("اختر تقدير الجودة والتعاون.");
    el.disabled=true; if(await save("evals", evalId(mid,month), data, true)){ close(); toast("حُفظ التقييم، وسيظهر له في صفحته."); } else el.disabled=false; return; }
  if(/^ar[A-Z]/.test(a) && await arAct(a, el, id)) return;
  if(a==="ackEval"){ el.disabled=true; const n=document.getElementById("ack_"+id); await save("evals", id, {ack:true, ackAt:today(), ackNote:n?n.value.trim():""}); toast("شكرًا، سُجّل اطّلاعك."); return; }
  if(a==="sched") return open(schedForm(id));

    if(!data.label) return toast("اكتب الشغل."); if(data.end && !data.start) return toast("اكتب وقت البداية."); if(data.start && data.end && toMin(data.end)<=toMin(data.start) && toMin(data.end)>180) return toast("وقت النهاية بعد البداية.");
    if(await save("slots", id||null, data, !!id)){ open(schedForm(m)); toast(id?"عُدّل.":"أُضيف."); } return; }
  if(a==="editSlot") return open(schedForm(el.dataset.m, id));
  if(a==="newLec") return open(lecForm(null));

  if(a==="takeLec"){ const l=S.lectures.find(x=>x.id===id); if(!l || !isAdmin()) return; el.disabled=true;

  if(a==="saveLec"){ const data={name:v("l_name"), sheikh:v("l_sheikh"), day:Number(v("l_day")), start:v("l_from"), end:v("l_to"), zoom:v("l_zoom"), sheet:v("l_sheet"), account:v("l_acct"), pauseFrom:v("l_pf"), pauseTo:v("l_pt"), startFrom:v("l_sf"), noOrg:$("#l_no").checked, offer:$("#l_of").checked, showDays:Number(v("l_show")||3), active:true};
    data.hold = $("#l_hold").checked && !data.startFrom; // كتابة «يبدأ من» تُنهي الحجز
    if(data.noOrg && data.offer) return toast("اختر واحدة: «لا يحتاج منظّم» أو «عرضه على المنظّمين».");
    if(!data.name) return toast("اكتب اسم المحاضرة."); if(!!data.pauseFrom!==!!data.pauseTo) return toast("اكتب تاريخ بداية الإيقاف ونهايته معًا، أو اتركهما فارغين."); if(data.pauseFrom && data.pauseTo<data.pauseFrom) return toast("تاريخ نهاية الإيقاف قبل بدايته."); if(data.end && !data.start) return toast("اكتب وقت البداية.");
    if(data.zoom && !safeUrl(data.zoom)) return toast("رابط زووم يجب أن يبدأ بـ https://"); if(data.sheet && !safeUrl(data.sheet)) return toast("رابط الشيت يجب أن يبدأ بـ https://");
    const oldName=(S.lectures.find(x=>x.id===id)||{}).name;
    el.disabled=true; const doc=await save("lectures", id||("lc_"+rid()), data, !!id);
    if(doc){ for(const s of lecSlots(doc.id)) await save("slots", s.id, {day:doc.day, start:doc.start||"", end:doc.end||"", label:doc.name}, true);
      // خانات البدلاء القادمة تتبع الموعد الجديد (والاسم إن كان هو اسم المحاضرة نفسه)
      for(const s of S.slots.filter(x=>x.lec===doc.id && x.date && x.date>=today())){ const up={start:doc.start||"", end:doc.end||""}; if(oldName && s.label===oldName) up.label=doc.name;
        if(up.start!==(s.start||"") || up.end!==(s.end||"") || up.label) await save("slots", s.id, up, true); }

  if(a==="delLec"){ if(!el.dataset.sure){ el.dataset.sure="1"; el.textContent="اضغط مرة أخرى للتأكيد"; return; }
    for(const s of S.slots.filter(x=>x.lec===id)) await remove("slots", s.id); await remove("lectures", id); close(); toast("حُذفت المحاضرة."); return; }

    close(); toast(want.length?"تم التكليف.":"أُلغي التكليف."); return; }
  if(a==="delSlot"){ const m=el.dataset.m; await remove("slots", id); open(schedForm(m)); return; }
});
document.addEventListener("change", e=>{ const a=e.target.dataset.a; if(a==="reqKind"){ open(reqForm(e.target.value)); return; } if(a==="day"){ S.day=e.target.value||today(); render(); } if(a==="month"){ S.month=e.target.value||today().slice(0,7); render(); } if(a==="sper"){ S.sper=e.target.value; render(); return; } if(a==="rmem"){ S.rmem=e.target.value; render(); } if(a==="rday"){ S.rday=e.target.value||today(); render(); } if(a==="myday"){ S.myday=e.target.value||today(); render(); } if(a==="arPick"){ S.arId=e.target.value; S.arF="need"; render(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") close();
  const t=e.target; if((e.key==="Enter"||e.key===" ") && t && t.getAttribute && t.getAttribute("role")==="button" && t.dataset.a){ e.preventDefault(); t.click(); } });
window.addEventListener("hashchange", ()=>{ S.view=location.hash.slice(1)||"today"; render(); });

(async function boot(){
  S.view=location.hash.slice(1)||"today";
  S.session=store.get("wahy_sup_session");
  if(!S.session){ S.phase="login"; render(); return; }
  render(); await refresh(false);
  for(let i=0; i<4 && !S.me && S.session && S.phase!=="login"; i++){ await new Promise(r=>setTimeout(r, 4000*(i+1))); await refresh(false); } // انقطاع مؤقت: نعيد المحاولة والجلسة باقية
  if(!S.me && S.phase!=="login"){ S.msg=S.session?"تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد تحميل الصفحة.":S.msg; render(); }
  setInterval(()=>{ if(document.visibilityState==="visible" && S.me) refresh(true); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && S.me) refresh(true); });
})();
</script>
